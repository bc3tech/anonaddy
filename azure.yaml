name: anonaddy
metadata:
  template: anonaddy-aca@0.1.0
infra:
  provider: bicep
  path: infra
services:
  app:
    project: .
    language: docker
    host: containerapp
    resourceName: ${APP_CONTAINER_APP_NAME}
    resourceGroup: ${RESOURCE_GROUP_NAME}
    docker:
      path: ./docker/app/Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
  mail:
    project: .
    language: docker
    host: containerapp
    resourceName: ${MAIL_CONTAINER_APP_NAME}
    resourceGroup: ${RESOURCE_GROUP_NAME}
    docker:
      path: ./docker/mail/Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
