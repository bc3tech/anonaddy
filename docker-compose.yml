services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonaddy-app:local
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonaddy-app:local
    env_file:
      - .env
    command: sh -c "php artisan queue:work --tries=3 --timeout=600 --memory=512"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonaddy-app:local
    env_file:
      - .env
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonaddy-app:local
    env_file:
      - .env
    command: sh -c "php artisan migrate --force && php artisan storage:link --force"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - setup

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-anonaddy}
      MYSQL_USER: ${DB_USERNAME:-anonaddy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  app-storage:
  app-bootstrap:
  mysql-data:
  redis-data:
